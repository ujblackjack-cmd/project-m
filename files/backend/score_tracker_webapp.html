<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Score Tracker — 웹 프로토타입</title>
<style>
  :root {
    --navy-dark: #1F1338;
    --navy: #2D1B4E;
    --gold: #C9922B;
    --gold-soft: #E8C179;
    --light: #F4F1F9;
    --text-muted: #A79BC7;
    --danger: #E05252;
    --ok: #4CAF7D;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--navy-dark);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    color: white;
    overflow-x: hidden;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top, 20px) 20px 32px;
  }
  header { text-align: center; margin-bottom: 18px; }
  .eyebrow {
    font-size: 12px; letter-spacing: 3px; color: var(--gold);
    font-weight: 700; text-transform: uppercase;
  }
  h1 { font-size: 21px; margin: 6px 0 2px; font-weight: 700; }
  .sub { font-size: 13px; color: var(--text-muted); }

  .measure-row {
    display: flex; gap: 8px; justify-content: center; margin: 22px 0 6px;
  }
  .measure-box {
    flex: 1; max-width: 90px;
    border: 2px solid #3E2E63;
    border-radius: 12px;
    padding: 10px 4px;
    text-align: center;
    transition: all .25s ease;
    background: rgba(255,255,255,0.02);
  }
  .measure-box .num { font-size: 11px; color: var(--text-muted); }
  .measure-box .notes { font-size: 13px; margin-top: 4px; letter-spacing: 1px; color: #D8D0EC; }
  .measure-box.active {
    border-color: var(--gold);
    background: linear-gradient(180deg, rgba(201,146,43,0.22), rgba(201,146,43,0.05));
    transform: translateY(-3px);
    box-shadow: 0 6px 18px rgba(201,146,43,0.25);
  }
  .measure-box.active .num { color: var(--gold); font-weight: 700; }
  .measure-box.active .notes { color: white; font-weight: 600; }

  .status-card {
    margin-top: 20px;
    background: var(--navy);
    border-radius: 16px;
    padding: 18px 20px;
    text-align: center;
  }
  .status-card .big-measure {
    font-size: 46px; font-weight: 800; color: white; line-height: 1;
  }
  .status-card .label { font-size: 12px; color: var(--text-muted); margin-top: 4px; letter-spacing: 1px; }

  .meter-row { display:flex; align-items:center; gap:10px; margin-top:16px; }
  .meter-row .meter-label { font-size:12px; color: var(--text-muted); width: 74px; text-align:right; flex-shrink:0; }
  .meter-track {
    flex: 1; height: 8px; background: #150C29; border-radius: 4px; overflow: hidden;
  }
  .meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold), var(--gold-soft)); transition: width .1s linear; }
  .meter-fill.conf { background: linear-gradient(90deg, #7A5FB8, var(--gold)); }

  .controls { margin-top: 24px; display:flex; gap: 10px; }
  button {
    flex: 1;
    padding: 15px 0;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .1s ease, opacity .2s;
  }
  button:active { transform: scale(0.97); }
  #startBtn { background: var(--gold); color: var(--navy-dark); }
  #stopBtn { background: #3E2E63; color: white; }
  #metroBtn { background: transparent; border: 2px solid #3E2E63; color: white; }
  #metroBtn.on { border-color: var(--gold); color: var(--gold); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .log-box {
    margin-top: 20px;
    background: #150C29;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 12px;
    color: #B7ACD6;
    height: 130px;
    overflow-y: auto;
    font-family: "SF Mono", ui-monospace, monospace;
    line-height: 1.7;
  }
  .log-box div.turn { color: var(--gold); font-weight: 700; }

  .note {
    margin-top: 16px;
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.6;
    text-align: center;
  }
  .note b { color: #D8D0EC; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">SCORE FOLLOWING · WEB PROTOTYPE</div>
    <h1>실시간 악보 추적 테스트</h1>
    <div class="sub">테스트 악보(4마디, 96bpm) · 마이크로 실시간 추적</div>
  </header>

  <div class="measure-row" id="measureRow"></div>

  <div class="status-card">
    <div class="big-measure" id="bigMeasure">–</div>
    <div class="label">현재 추적 마디</div>

    <div class="meter-row">
      <div class="meter-label">입력 레벨</div>
      <div class="meter-track"><div class="meter-fill" id="levelMeter"></div></div>
    </div>
    <div class="meter-row">
      <div class="meter-label">추적 신뢰도</div>
      <div class="meter-track"><div class="meter-fill conf" id="confMeter"></div></div>
    </div>
  </div>

  <div class="controls">
    <button id="startBtn">▶ 시작</button>
    <button id="stopBtn" disabled>■ 정지</button>
  </div>
  <div class="controls">
    <button id="metroBtn">🕓 메트로놈 (96bpm)</button>
  </div>

  <div class="log-box" id="logBox"></div>

  <div class="note">
    이 화면은 <b>Python 없이 브라우저(Web Audio API)만으로</b> 크로마 특징 추출 +
    Online DTW를 전부 실행하는 프로토타입입니다. 마이크 권한을 허용한 뒤 피아노(또는
    앱)로 테스트 멜로디를 연주해보세요: <b>도레미파 솔라솔파 미레도레 미도 솔시레 도미솔</b>
  </div>
</div>

/* =========================================================================
   2) Online DTW 엔진 (Python online_dtw_module.py 의 로직을 그대로 JS로 포팅)
      - 탐색 윈도우 안에서만 누적비용 계산 -> 실시간 처리 가능
      - '이력 없는 새 위치'에 큰 페널티를 줘서 엉뚱한 곳으로 튀는 버그 방지
        (지난 파이썬 프로토타입에서 발견/수정한 것과 동일한 처리)
   ========================================================================= */
class OnlineDTW {
  constructor(refChroma, windowSec, hopSec) {
    this.ref = refChroma;               // [12][N]
    this.nRef = refChroma[0].length;
    this.window = Math.round(windowSec / hopSec);
    this.jEst = 0;
    this.prevRow = null;                // 직전 프레임의 누적비용 (윈도우 범위)
    this.prevLo = 0;
    this.lastCost = 0;                  // 가장 최근 스텝의 최소 매칭비용 (신뢰도 표시용)
  }

  _norm(vec) {
    let s = 0;
    for (let i = 0; i < vec.length; i++) s += vec[i] * vec[i];
    const n = Math.sqrt(s) + 1e-8;
    return vec.map(v => v / n);
  }

  step(liveVec) {
    const lo = Math.max(0, this.jEst - this.window);
    const hi = Math.min(this.nRef, this.jEst + this.window + 1);
    const width = hi - lo;

    const liveN = this._norm(liveVec);

    // 이번 프레임 vs 윈도우 내 각 정답 프레임의 코사인 거리
    const costNow = new Float64Array(width);
    for (let k = 0; k < width; k++) {
      const j = lo + k;
      let sim = 0;
      for (let p = 0; p < 12; p++) sim += liveN[p] * this.ref[p][j];
      costNow[k] = 1 - sim;
    }

    let dNow;
    if (this.prevRow === null) {
      dNow = costNow;
    } else {
      dNow = new Float64Array(width);
      const NO_HISTORY_PENALTY = 1e6; // 이력 없는 위치가 부당하게 유리해지는 버그 방지
      for (let k = 0; k < width; k++) {
        const j = lo + k;
        const idxPrev = j - this.prevLo;
        const dDiag = (idxPrev - 1 >= 0 && idxPrev - 1 < this.prevRow.length) ? this.prevRow[idxPrev - 1] : Infinity;
        const dUp   = (idxPrev >= 0 && idxPrev < this.prevRow.length) ? this.prevRow[idxPrev] : Infinity;
        const dLeft = k > 0 ? dNow[k - 1] : Infinity;
        let best = Math.min(dDiag, dUp, dLeft);
        if (!isFinite(best)) best = NO_HISTORY_PENALTY;
        dNow[k] = costNow[k] + best;
      }
    }

    // 최소 누적비용 위치 = 이번 프레임의 추정 위치
    let bestK = 0, bestVal = Infinity;
    for (let k = 0; k < width; k++) {
      if (dNow[k] < bestVal) { bestVal = dNow[k]; bestK = k; }
    }
    this.jEst = lo + bestK;
    this.lastCost = costNow[bestK]; // 그 지점의 '순간' 매칭 비용(0=완전일치, 클수록 안맞음) -> 신뢰도 지표
    this.prevRow = dNow;
    this.prevLo = lo;
    return this.jEst;
  }
}

/* =========================================================================
   3) 실시간 FFT 기반 크로마 추출 (라이브러리 없이 순수 JS)
      - 라디언스-2 FFT -> 주파수 빈을 12개 음고 클래스(피치클래스)로 매핑
      - Python의 librosa.feature.chroma_stft 와 개념적으로 동일한 방식
   ========================================================================= */
function fft(re, im) {
  const n = re.length;
  if (n <= 1) return;
  // 비트 반전 순서 정렬
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wRe = Math.cos(ang), wIm = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let curRe = 1, curIm = 0;
      for (let k = 0; k < len / 2; k++) {
        const uRe = re[i + k], uIm = im[i + k];
        const vRe = re[i + k + len / 2] * curRe - im[i + k + len / 2] * curIm;
        const vIm = re[i + k + len / 2] * curIm + im[i + k + len / 2] * curRe;
        re[i + k] = uRe + vRe; im[i + k] = uIm + vIm;
        re[i + k + len / 2] = uRe - vRe; im[i + k + len / 2] = uIm - vIm;
        const nRe = curRe * wRe - curIm * wIm;
        const nIm = curRe * wIm + curIm * wRe;
        curRe = nRe; curIm = nIm;
      }
    }
  }
}

// 미리 각 FFT 빈 -> 피치클래스(0~11) 매핑 테이블을 만들어둠 (sampleRate 확정 후 1회 계산)
let binToPitchClass = null;
function buildBinMap(sampleRate, fftSize) {
  const map = new Int8Array(fftSize / 2);
  for (let k = 0; k < fftSize / 2; k++) {
    const freq = k * sampleRate / fftSize;
    if (freq < 40 || freq > 5000) { map[k] = -1; continue; } // 악기 음역 밖은 제외
    const midi = 69 + 12 * Math.log2(freq / 440);
    let pc = Math.round(midi) % 12;
    if (pc < 0) pc += 12;
    map[k] = pc;
  }
  return map;
}

function computeChroma(buffer, sampleRate) {
  const n = N_FFT;
  const re = new Float64Array(n);
  const im = new Float64Array(n);
  const len = Math.min(buffer.length, n);
  // 한 윈도우(Hann) 적용
  for (let i = 0; i < len; i++) {
    const w = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (len - 1));
    re[i] = buffer[buffer.length - len + i] * w;
  }
  fft(re, im);

  if (!binToPitchClass) binToPitchClass = buildBinMap(sampleRate, n);

  const chroma = new Float64Array(12);
  for (let k = 1; k < n / 2; k++) {
    const pc = binToPitchClass[k];
    if (pc < 0) continue;
    const mag = Math.sqrt(re[k] * re[k] + im[k] * im[k]);
    chroma[pc] += mag;
  }
  // librosa 기본과 동일하게 최댓값 1로 정규화
  const maxV = Math.max(...chroma, 1e-8);
  for (let i = 0; i < 12; i++) chroma[i] /= maxV;
  return Array.from(chroma);
}

    }});

    const rms = Math.sqrt(sum / input.length);
    els.levelMeter.style.width = Math.min(100, rms * 400) + '%';

    // 롤링 버퍼 유지 (N_FFT 길이만큼)
    const merged = new Float32Array(rollingBuffer.length + input.length);
    merged.set(rollingBuffer); merged.set(input, rollingBuffer.length);
    rollingBuffer = merged.length > N_FFT ? merged.slice(merged.length - N_FFT) : merged;
    if (rollingBuffer.length < N_FFT) return; // 아직 버퍼가 덜 참

    const chroma = computeChroma(rollingBuffer, audioCtx.sampleRate);
    const jEst = tracker.step(chroma);
    const measure = refFrameToMeasure(jEst);

    // 신뢰도 = 1 - 매칭비용(0~1 근사). 낮은 코사인거리일수록 신뢰도 높음
    const confidence = Math.max(0, 1 - tracker.lastCost);
    els.confMeter.style.width = Math.round(confidence * 100) + '%';

    if (measure !== lastMeasure) {
      setActiveMeasure(measure);
      log(`${measure}마디 진입 감지 → 페이지 넘김 트리거`, true);
      lastMeasure = measure;
    }
  };

  sourceNode.connect(processorNode);
  processorNode.connect(audioCtx.destination); // Safari 등 일부 브라우저는 destination 연결 필요

  running = true;
  els.start.disabled = true;
  els.stop.disabled = false;
  log('마이크 연결 완료, 추적 시작');
  setActiveMeasure(1);
  lastMeasure = 1;
}

function stop() {
  running = false;
  if (processorNode) processorNode.disconnect();
  if (sourceNode) sourceNode.disconnect();
  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  els.start.disabled = false;
  els.stop.disabled = true;
  log('정지됨');
}

els.start.addEventListener('click', start);
els.stop.addEventListener('click', stop);

/* =========================================================================
   5) 메트로놈 (Web Audio 정밀 스케줄러 — look-ahead 방식)
   ========================================================================= */
let metroOn = false, metroCtx = null, metroTimer = null, nextClickTime = 0;
const LOOKAHEAD = 25.0, SCHEDULE_AHEAD = 0.1;

function scheduleClick(time) {
  const osc = metroCtx.createOscillator();
  const gain = metroCtx.createGain();
  osc.frequency.value = 1000;
  gain.gain.setValueAtTime(0.25, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.03);
  osc.connect(gain); gain.connect(metroCtx.destination);
  osc.start(time); osc.stop(time + 0.03);
}

function metroScheduler() {
  while (nextClickTime < metroCtx.currentTime + SCHEDULE_AHEAD) {
    scheduleClick(nextClickTime);
    nextClickTime += 60.0 / TEMPO_BPM;
  }
}

function toggleMetronome() {
  metroOn = !metroOn;
  els.metro.classList.toggle('on', metroOn);
  if (metroOn) {
    metroCtx = metroCtx || new (window.AudioContext || window.webkitAudioContext)();
    nextClickTime = metroCtx.currentTime + 0.1;
    metroTimer = setInterval(metroScheduler, LOOKAHEAD);
    els.metro.textContent = '🕓 메트로놈 끄기';
  } else {
    clearInterval(metroTimer);
    els.metro.textContent = '🕓 메트로놈 (96bpm)';
  }
}
els.metro.addEventListener('click', toggleMetronome);

log(`정답 특징 로드 완료: ${nRefFrames}프레임, ${MEASURES_INFO.length}마디, ${TEMPO_BPM}bpm`);
</script>
</body>
</html>
